openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: FurniFlip API - AI-powered furniture photo editing and ad generation
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and user management
  - name: projects
    description: Furniture flip projects
  - name: images
    description: AI image editing (background removal, room staging)
  - name: ads
    description: Facebook Marketplace ad generation
  - name: usage
    description: Usage tracking and subscription info
  - name: subscriptions
    description: Subscription management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthInput"
      responses:
        "201":
          description: Registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid input or email already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthInput"
      responses:
        "200":
          description: Logged in successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List user's projects
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project and upload original image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/stats:
    get:
      operationId: getProjectStats
      tags: [projects]
      summary: Get summary stats for dashboard
      responses:
        "200":
          description: Aggregated stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStats"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a single project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /projects/{id}/remove-background:
    post:
      operationId: removeBackground
      tags: [images]
      summary: Remove the background from a project image
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Background-removed image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditedImage"
        "402":
          description: Trial limit reached or no active subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{id}/stage:
    post:
      operationId: stageRoom
      tags: [images]
      summary: Stage the furniture in a styled room
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StageInput"
      responses:
        "200":
          description: Staged image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditedImage"
        "402":
          description: Trial limit reached or no active subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{id}/images:
    get:
      operationId: listProjectImages
      tags: [images]
      summary: List all edited images for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Edited images
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EditedImage"

  /projects/{id}/ads:
    get:
      operationId: listProjectAds
      tags: [ads]
      summary: List all ads for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ad"
    post:
      operationId: generateAd
      tags: [ads]
      summary: Generate a Facebook Marketplace ad for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdInput"
      responses:
        "201":
          description: Generated ad
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ad"
        "402":
          description: Trial limit reached or no active subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /usage:
    get:
      operationId: getUsage
      tags: [usage]
      summary: Get current user's usage and plan info
      responses:
        "200":
          description: Usage info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageInfo"

  /subscriptions/checkout:
    post:
      operationId: createCheckoutSession
      tags: [subscriptions]
      summary: Create a Stripe checkout session for the Pro plan
      responses:
        "200":
          description: Checkout session URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"

  /subscriptions/portal:
    post:
      operationId: createPortalSession
      tags: [subscriptions]
      summary: Create a Stripe billing portal session
      responses:
        "200":
          description: Portal session URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"

  /subscriptions/webhook:
    post:
      operationId: stripeWebhook
      tags: [subscriptions]
      summary: Stripe webhook handler
      responses:
        "200":
          description: Webhook received

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        plan:
          type: string
          enum: [free, pro]
        trialUsed:
          type: integer
        trialLimit:
          type: integer
        stripeCustomerId:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - plan
        - trialUsed
        - trialLimit
        - createdAt

    AuthInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 8
      required:
        - email
        - password

    Project:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        originalImageUrl:
          type: string
        imageCount:
          type: integer
        adCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - name
        - originalImageUrl
        - imageCount
        - adCount
        - createdAt

    ProjectDetail:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        originalImageUrl:
          type: string
        images:
          type: array
          items:
            $ref: "#/components/schemas/EditedImage"
        ads:
          type: array
          items:
            $ref: "#/components/schemas/Ad"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - name
        - originalImageUrl
        - images
        - ads
        - createdAt

    ProjectInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
      required:
        - name

    ProjectStats:
      type: object
      properties:
        totalProjects:
          type: integer
        totalImages:
          type: integer
        totalAds:
          type: integer
        recentProjects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
      required:
        - totalProjects
        - totalImages
        - totalAds
        - recentProjects

    EditedImage:
      type: object
      properties:
        id:
          type: integer
        projectId:
          type: integer
        type:
          type: string
          enum: [background_removed, staged]
        imageUrl:
          type: string
        roomStyle:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - projectId
        - type
        - imageUrl
        - createdAt

    StageInput:
      type: object
      properties:
        roomStyle:
          type: string
          enum: [modern, rustic, bohemian, minimalist, industrial, traditional, coastal, mid_century]
        additionalPrompt:
          type: ["string", "null"]
        sourceImageId:
          type: ["integer", "null"]
          description: ID of an edited image to use as source (e.g. background-removed). Uses original if null.
      required:
        - roomStyle

    Ad:
      type: object
      properties:
        id:
          type: integer
        projectId:
          type: integer
        title:
          type: string
        description:
          type: string
        price:
          type: ["number", "null"]
        condition:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - projectId
        - title
        - description
        - createdAt

    AdInput:
      type: object
      properties:
        price:
          type: ["number", "null"]
        condition:
          type: string
          enum: [like_new, good, fair, poor]
        location:
          type: ["string", "null"]
        additionalContext:
          type: ["string", "null"]
        imageId:
          type: ["integer", "null"]
          description: ID of edited image to feature in the ad. Uses original if null.
      required: []

    UsageInfo:
      type: object
      properties:
        plan:
          type: string
          enum: [free, pro]
        trialUsed:
          type: integer
        trialLimit:
          type: integer
        isTrialExpired:
          type: boolean
        hasActiveSubscription:
          type: boolean
      required:
        - plan
        - trialUsed
        - trialLimit
        - isTrialExpired
        - hasActiveSubscription

    CheckoutSession:
      type: object
      properties:
        url:
          type: string
      required:
        - url
