services:
  - type: web
    name: furniflip-api
    runtime: node
    plan: starter
    region: virginia
    buildCommand: corepack enable && corepack prepare pnpm@11.13.1 --activate && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    preDeployCommand: pnpm --filter @workspace/db run migrate
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    autoDeployTrigger: commit
    disk:
      name: furniflip-uploads
      mountPath: /opt/render/project/src/artifacts/api-server/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: furniflip-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        sync: false
      - key: LIFETIME_PRO_EMAILS
        sync: false

  - type: web
    name: furniflip-web
    runtime: static
    buildCommand: corepack enable && corepack prepare pnpm@11.13.1 --activate && pnpm install --frozen-lockfile && pnpm --filter @workspace/furniture-flip run build
    staticPublishPath: artifacts/furniture-flip/dist/public
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /api/*
        destination: https://furniflip-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: furniflip-db
    plan: basic-256mb
    region: virginia
    postgresMajorVersion: "18"
    ipAllowList: []
